{{- if .Values.stack.grafana.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: yuyu-grafana-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yuyu-grafana-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-yuyu-grafana-https@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: {{ .Values.stack.grafana.ingress.ingressClassName }}
  rules:
    {{- range .Values.stack.grafana.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.stack.grafana.fullnameOverride }}
                port:
                  number: 80
    {{- end }}
{{- end }}
