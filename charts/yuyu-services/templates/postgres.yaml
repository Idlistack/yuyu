apiVersion: v1
kind: ConfigMap
metadata:
  name: yuyu-postgres-hba
data:
  pg_hba.conf: |
    local all all trust
    hostssl all all all scram-sha-256
    hostnossl all all all reject
---
apiVersion: v1
kind: Service
metadata:
  name: yuyu-postgres
spec:
  selector: { app: yuyu-postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yuyu-postgres
spec:
  serviceName: yuyu-postgres
  replicas: 1
  selector:
    matchLabels: { app: yuyu-postgres }
  template:
    metadata:
      labels: { app: yuyu-postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          args: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/tls.crt", "-c", "ssl_key_file=/tls/tls.key", "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.existingSecret }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: hba
              mountPath: /etc/postgresql
              readOnly: true
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: hba
          configMap:
            name: yuyu-postgres-hba
        - name: tls
          secret:
            secretName: yuyu-postgres-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
