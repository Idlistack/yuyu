apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yuyu-services
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [yuyu-postgres, yuyu-redis, yuyu-garage]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 8443 }
