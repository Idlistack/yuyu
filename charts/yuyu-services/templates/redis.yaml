apiVersion: v1
kind: Service
metadata:
  name: yuyu-redis
spec:
  selector: { app: yuyu-redis }
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yuyu-redis
spec:
  serviceName: yuyu-redis
  replicas: 1
  selector:
    matchLabels: { app: yuyu-redis }
  template:
    metadata:
      labels: { app: yuyu-redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [sh, -ec]
          args:
            - |
              umask 077
              printf 'requirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis-auth.conf
              exec redis-server /tmp/redis-auth.conf --port 0 --tls-port 6379 --tls-cert-file /tls/tls.crt --tls-key-file /tls/tls.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
          envFrom:
            - secretRef:
                name: {{ .Values.redis.existingSecret }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            exec:
              command: [sh, -ec, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --tls --cacert /tls/ca.crt ping | grep -q PONG']
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: tls
          secret:
            secretName: yuyu-redis-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
