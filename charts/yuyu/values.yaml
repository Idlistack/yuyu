replicaCount: 1

image:
  repository: ghcr.io/your-org/yuyu
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Create this Secret outside Helm (External Secrets, Sealed Secrets, or kubectl).
# It must contain every production runtime variable in .env.example.
existingSecret: yuyu-runtime

# Optional ConfigMap containing ca.crt for private service TLS.
extraCaConfigMap: ""

outbox:
  enabled: true
  schedule: "* * * * *"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # Requires Traefik CRDs; leave disabled for other ingress controllers.
  redirectToHttps: false
  # Requires Traefik and preserved source IPs. Empty permits any source.
  allowedSourceRanges: []
  className: ""
  annotations: {}
  hosts:
    - host: events.dev.idliapps.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingressNamespace: kube-system
  ingressPodLabels:
    app.kubernetes.io/name: traefik

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

migration:
  # Use a separate database owner credential for schema changes.
  existingSecret: ""
  # Enable for production releases after publishing the Docker `migrator` target.
  enabled: true
  image:
    repository: ghcr.io/your-org/yuyu-migrator
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 1
  activeDeadlineSeconds: 300

nodeSelector: {}
tolerations: []
affinity: {}
