# Images are built on the single k3s node and imported into containerd.
# Override both tags with the immutable release identifier at deployment time.
fullnameOverride: yuyu
image:
  repository: docker.io/library/yuyu
  pullPolicy: Never
existingSecret: yuyu-runtime
extraCaConfigMap: yuyu-service-ca
migration:
  existingSecret: yuyu-migration
  image:
    repository: docker.io/library/yuyu-migrator
    pullPolicy: Never
ingress:
  enabled: true
  redirectToHttps: true
  # Cloudflare's published ranges, verified 2026-09-14:
  # https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
  # Restrict the origin before trusting CF-Connecting-IP in the application.
  allowedSourceRanges:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: yuyu.idliapps.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: yuyu-idliapps-com-tls
      hosts: [yuyu.idliapps.com]
networkPolicy:
  enabled: true
